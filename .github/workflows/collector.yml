name: Collect V2Ray Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Xray-core
        run: |
          curl -sL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/xray
          xray version

      - name: Run collector
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          MAX_CONFIGS_PER_OUTPUT: 200
          MAX_WORKERS: 8
          PING_TIMEOUT: 8
          LATENCY_THRESHOLD_MS: 5000
          TCP_FILTER_LIMIT: 2000
          TCP_FILTER_WORKERS: 100
          TCP_FILTER_TIMEOUT: 2.0
        run: python -m src.main

      - name: Commit updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          git diff --staged --quiet || git commit -m "chore: update configs [skip ci]"
          git push

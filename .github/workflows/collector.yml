name: Collect V2Ray Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
  # Auto-run right after a code push so fixes take effect immediately.
  # The paths filter is the anti-loop guard: the bot's own
  # "chore: update configs" commits only touch configs/, which is NOT
  # listed here, so they never retrigger this workflow.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/collector.yml"

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install xray-core
        env:
          XRAY_VERSION: v26.3.27
        run: |
          echo "Installing $XRAY_VERSION"
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip -d /tmp/xray
          sudo install -m 755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Run collector
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          MAX_WORKERS: 40
          FETCH_TIMEOUT: 15
          PING_TIMEOUT: 5
          PING_RETRIES: 0
          LATENCY_THRESHOLD_MS: 8000
          TELEGRAM_MESSAGES_PER_CHANNEL: 20
          GEOIP_ENABLED: "true"
          GEOIP_CACHE_TTL_SECONDS: 86400
          OUTPUT_DIR: configs
          MAX_CONFIGS_PER_OUTPUT: 200
          TCP_FILTER_LIMIT: 600
          TCP_FILTER_WORKERS: 100
          TCP_FILTER_TIMEOUT: 2.0
          XRAY_PATH: xray
          TEST_URL: http://cp.cloudflare.com
          XRAY_STARTUP_DELAY: 1.2
        run: python -m src.main

      - name: Commit updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A picks up deleted stale country_/network_ files as well
          git add -A configs/
          git diff --staged --quiet || git commit -m "chore: update configs [skip ci]"
          git pull --rebase --autostash || true
          git push
